name: CI

# Manual-only by design: this prevents repository activity from automatically consuming
# billable GitHub-hosted runner minutes on private repositories.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy
      - run: pytest -m "not model" -q
      - run: python -m benchmark.run_simulated_evaluation --check --output-dir /tmp/evaluation
      - run: python -m pip check
      - run: python -m compileall -q apps inference runtime scheduler serving_platform benchmark tests

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gpu-aware-llm-serving-platform:ci
