[project]
name = "llm-inference-scheduler"
version = "0.1.0"
description = "Local CPU LLM scheduling and dynamic micro-batching study"
requires-python = ">=3.11,<3.13"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
files = ["app/config.py", "scheduler/request.py"]
