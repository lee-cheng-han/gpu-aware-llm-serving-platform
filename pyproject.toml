[project]
name = "gpu-aware-llm-serving-platform"
version = "0.1.0"
description = "GPU-aware LLM serving control plane with local dynamic batching"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
files = [
    "apps/gateway/config.py",
    "apps/worker",
    "scheduler/request.py",
    "serving_platform",
    "runtime",
]

[[tool.mypy.overrides]]
module = ["inference.*"]
ignore_errors = true
follow_imports = "skip"
