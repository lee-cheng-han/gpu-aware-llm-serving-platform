apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-inference
  namespace: llm-inference
spec:
  podSelector:
    matchLabels:
      app: llm-inference
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm-inference
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
